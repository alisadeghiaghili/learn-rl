[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnrl"
version = "0.1.0"
description = "Interactive reinforcement learning visualizer, sandbox, and tutorial — inspired by LearnGitBranching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Sadeghi Aghili" }]
keywords = ["reinforcement-learning", "education", "visualization", "tutorial", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[project.scripts]
learnrl = "learnrl.cli:main"

[project.urls]
Homepage = "https://github.com/aliaghili/learn-rl"

[tool.setuptools.packages.find]
where = ["."]
include = ["learnrl*"]

[tool.setuptools.package-data]
learnrl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
